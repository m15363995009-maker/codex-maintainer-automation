name: Pull request report

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out trusted base branch only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Generate advisory report from GitHub metadata
        id: review
        uses: ./
        with:
          github_token: ${{ github.token }}

      - name: Upload advisory report
        uses: actions/upload-artifact@v7
        with:
          name: pull-request-report-${{ github.event.pull_request.number }}
          path: ${{ steps.review.outputs.review_file }}
          if-no-files-found: error
