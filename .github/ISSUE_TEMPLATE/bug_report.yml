name: Bug report
description: Report a reproducible problem with the maintainer assistant
title: "bug: "
labels: [bug]
body:
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include the command, fixture, or public pull request URL.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      placeholder: "20.x"
